name: London House Exchange (Property Partner)
description: >-
  London House Exchange, formerly Property Partner, is an FCA-regulated online
  platform that operates the world's only regulated exchange for individual
  residential, student and commercial properties. Founded in 2014 and now owned
  by US digital homeownership company Better, the platform lets retail investors
  buy fractional shares in professionally managed UK properties, earn monthly
  dividends from rental income, and trade those shares with other investors on a
  secondary market. It also offers property-backed mortgage bonds, an ISA, and
  bridging finance, with over £100m of fractionalised property assets under
  management and thousands of investors across more than 80 countries. It was
  surfaced as a Seedcamp portfolio company and added to the API Evangelist
  network. No public developer API, OpenAPI specification, or developer portal
  was found during enrichment.
